<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0x-xnum / writeup</title>
    <!-- We use marked.js to automatically convert Markdown to HTML! -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        :root {
            --bg-color: #0d1117;
            --text-main: #c6c8cc;
            --text-muted: #8b8e94;
            --text-dark: #6b6e74;
            --accent: #a6e22e; /* green */
            --border: #2b2d31;
            --code-bg: #161b22;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 720px;
            width: 100%;
            padding: 2rem 1.25rem;
            box-sizing: border-box;
            margin-top: 2rem;
            margin-bottom: 4rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            margin-bottom: 2rem;
            display: inline-block;
        }
        
        .back-link:hover {
            color: var(--text-main);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }
        
        /* Markdown rendering styles */
        #content h1 {
            color: var(--accent);
            font-size: 1.6rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        #content h2 {
            color: var(--text-main);
            font-size: 1.3rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
            margin-top: 2.5rem;
        }
        
        #content h3 {
            color: var(--text-main);
            font-size: 1.1rem;
            margin-top: 2rem;
        }

        #content a {
            color: var(--accent);
            text-decoration: none;
        }
        
        #content a:hover {
            text-decoration: underline;
        }

        #content p {
            margin-bottom: 1.2rem;
        }

        #content code {
            background-color: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            color: #ff7b72;
        }

        #content pre {
            background-color: var(--code-bg);
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border);
        }

        #content pre code {
            background-color: transparent;
            padding: 0;
            color: var(--text-main);
        }

        #content blockquote {
            border-left: 4px solid var(--accent);
            margin: 0;
            padding-left: 1rem;
            color: var(--text-muted);
            background-color: rgba(166, 226, 46, 0.05);
            padding: 10px 15px;
        }

        #content img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: 1px solid var(--border);
            margin: 1rem 0;
        }
        
        .loading {
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }
        
        .caret {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--text-main);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/blog.html" class="back-link">← cd ../</a>
        
        <div id="content">
            <div class="loading">Loading writeup<span class="caret"></span></div>
        </div>
    </div>

    <script>
        // Use GitHub Pages 404 routing hack to get clean URLs
        const path = window.location.pathname;
        let slug = path.split('/').filter(p => p).pop(); // Get last path segment
        
        // Default to a 404 message if no valid slug
        if (!slug || slug === '404' || slug === '404.html') {
            document.getElementById('content').innerHTML = "<h1>404</h1><p>Page not found.</p>";
        } else {
            const fileName = slug + '.md';
            // Fetch the markdown file from the posts/ directory
            fetch(`/posts/${fileName}`)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.text();
                })
                .then(text => {
                    // Convert Markdown to HTML using marked.js
                    document.getElementById('content').innerHTML = marked.parse(text);
                    document.title = "0x-xnum / " + slug;
                })
                .catch(error => {
                    document.getElementById('content').innerHTML = `<h1>404</h1><p>Could not load the writeup: <code>${slug}</code></p>`;
                });
        }
    </script>
</body>
</html>
